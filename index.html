<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Damien Cossé</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <script defer src="js/script.js"></script>
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Memory</h1>
    </header>
    <section aria-label="Commandes du jeu">
        <button id="reset">Commencer</button>
    </section>
    <section id="infos" aria-label="Informations du jeu" aria-live="polite">
        <div id="coups">Coups : 0</div>
        <div id="temps">Temps : 00:00</div>
        <div id="result"></div>
    </section>
    <main id="game-board" aria-label="Plateau de jeu"></main>
</body>

</html>
